name: Lean (W2)

on:
  push:
    branches: ["main"]
    tags: ["*"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build the W2 library (Mathlib cache restored automatically)
        uses: leanprover/lean-action@v1
        with:
          auto-config: "false"
          build: "true"
          test: "false"
          lint: "false"
          use-mathlib-cache: "auto"
          use-github-cache: "true"

      - name: Make lake available to later steps
        run: echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Forbid sorry in released source files
        run: |
          if grep -rn --include='*.lean' -w 'sorry' W2/ ; then
            echo "::error::'sorry' found in W2/ (move development work to a branch or to W2Dev/)"; exit 1
          fi

      - name: Set up Python for paper validation
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Validate the paper, its Lean proofs and numerical results
        run: |
          python -m pip install -r requirements.txt
          python Python-Validation/run_validation.py --output validation-results

      - name: Axiom audit and Lean report
        run: python3 scripts/axiom_audit.py

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lean-report
          path: |
            lean_report.md
            axiom_audit.log
            validation-results/
